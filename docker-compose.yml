services:
  postgres:
    image: postgres:17-alpine
    container_name: dsa-quest-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-dsaquest}
      POSTGRES_USER: ${DB_USERNAME:-dsaquest}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - dsa-quest-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  dsa-quest-postgres-data:
